---
layout: default
---

<div class="search container max-width-2">
  <div id="search-container">
    <h3 class="center mb3 blue">Search Recipes</h3>
    <input type="text" id="search-input" placeholder="search titles, ingredients, or tags...">
  </div>
</div>

<div class="container max-width-2 px2">
  <ul id="results-container" class="mt2"></ul>
</div>

<script src="/plugins/simple-jekyll-search.min.js" type="text/javascript"></script>

<script>
SimpleJekyllSearch({
  searchInput: document.getElementById('search-input'),
  resultsContainer: document.getElementById('results-container'),
  json: '/search.json',
  searchResultTemplate: '<li class="py1"><a href="{url}">{title}</a></li>',
  limit: 0
})
</script>

<script>
  $('#search-input').on('input', function() {
    var currentHeight = $('#search-container').outerHeight();
    $('.search').addClass('used').css('height', currentHeight);
  });
</script>
